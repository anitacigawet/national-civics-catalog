name: Validate catalog

on:
  pull_request:
  pull_request_target:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  catalog:
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate JSONL catalog
        run: python .github/scripts/validate_catalog.py

  trusted-contribution:
    if: github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.fork
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out trusted base code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted-base
          fetch-depth: 1
          persist-credentials: false
      - name: Check out incoming files as untrusted data
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: incoming
          fetch-depth: 1
          persist-credentials: false
      - name: Check one catalog entry with trusted code
        run: >-
          python trusted-base/.github/scripts/check_contribution.py
          --base-root trusted-base
          --candidate-root incoming
          --summary "$GITHUB_STEP_SUMMARY"
