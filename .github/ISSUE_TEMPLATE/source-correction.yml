name: Add or correct a continuing civic source
description: Report factual evidence about a publisher, place, endpoint, or coverage relationship.
title: "Source: "
labels:
  - source-review
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve the catalog. Submit a continuing collection-level source, not one meeting's page, document, recording, transcript, or summary. Inclusion does not establish governmental status, legal authority, or endorsement.
  - type: input
    id: publisher
    attributes:
      label: Publisher
      description: Name the government, Tribal government, chapter, district, or civic body that publishes or authorizes the source.
      placeholder: Public name of the publishing body
    validations:
      required: true
  - type: dropdown
    id: publisher_type
    attributes:
      label: Publisher type
      options:
        - Municipality
        - County
        - Tribal government
        - Tribal chapter
        - Community council
        - Special district
        - Other public body
    validations:
      required: true
  - type: input
    id: place
    attributes:
      label: Covered place
      description: Give the place name, every applicable state or territory, and known counties.
      placeholder: Place, state or territory, United States
    validations:
      required: true
  - type: dropdown
    id: endpoint_type
    attributes:
      label: Endpoint type
      options:
        - Primary meeting source
        - Meeting calendar
        - Meeting documents index
        - Agenda index
        - Minutes index
        - Public notices index
        - Video archive
        - Other collection-level source
    validations:
      required: true
  - type: input
    id: endpoint_url
    attributes:
      label: Endpoint URL
      description: Link to the continuing collection, not an individual meeting artifact.
      placeholder: https://...
    validations:
      required: true
  - type: dropdown
    id: source_relationship
    attributes:
      label: How is the source related to the publisher?
      options:
        - First-party source
        - Authorized service
    validations:
      required: true
  - type: input
    id: evidence_url
    attributes:
      label: First-party evidence URL
      description: Provide the publisher page that establishes the source relationship. It may be the endpoint itself.
      placeholder: https://...
    validations:
      required: true
  - type: dropdown
    id: coverage_relationship
    attributes:
      label: How does the publisher relate to the covered place?
      options:
        - Direct jurisdiction
        - Civic representation by a community council
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: What should change?
      description: Briefly explain what is missing, moved, or incorrect. Do not paste meeting content, personal information, code, screenshots, or private collection details.
    validations:
      required: true
  - type: checkboxes
    id: boundary
    attributes:
      label: Publication boundary
      options:
        - label: This is a continuing collection-level source, not one meeting's content or document.
          required: true
        - label: I am providing factual links and am not claiming endorsement or government status beyond the evidence.
          required: true
